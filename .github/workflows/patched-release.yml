name: Patched Beta - Android release (optional iOS)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub prerelease if required signed builds and tests pass'
        type: boolean
        default: false
      include_ios:
        description: 'Also build a signed iOS IPA (requires Apple signing secrets)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*-patched.*'
    branches:
      - patched
    paths:
      - 'release-requests/android-tag.txt'

permissions:
  contents: write

concurrency:
  group: patched-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      beta_sha: ${{ steps.meta.outputs.beta_sha }}
      patch_sha: ${{ steps.meta.outputs.patch_sha }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      build_number: ${{ steps.meta.outputs.build_number }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: patchset
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: beta
          path: source
          persist-credentials: false
      - name: Freeze exact input revisions and validate tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version_line="$(awk '/^version: / {print $2; exit}' source/pubspec.yaml)"
          version="$(printf '%s' "$version_line" | cut -d '+' -f 1)"
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == "refs/heads/patched" ]]; then
            request_file="patchset/release-requests/android-tag.txt"
            if [[ ! -f "$request_file" ]]; then
              echo "::error::Missing explicit Android release request."
              exit 1
            fi
            tag="$(tr -d '\r\n' < "$request_file")"
            if [[ "$tag" == *-both ]]; then
              echo "::error::A branch release request is Android-only; use a -both tag for signed iOS."
              exit 1
            fi
          else
            tag="v$version-patched.$GITHUB_RUN_NUMBER"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+)*-patched\.[0-9]+(-both)?$ ]]; then
            echo "::error::Use v2026.10.100-patched.1 (Android) or v2026.10.100-patched.1-both (Android+iOS)"
            exit 1
          fi
          if [[ "$tag" != v"$version"-patched.* ]]; then
            echo "::error::Tag version does not match the checked-out beta pubspec version."
            exit 1
          fi
          {
            echo "beta_sha=$(git -C source rev-parse HEAD)"
            echo "patch_sha=$(git -C patchset rev-parse HEAD)"
            echo "tag=$tag"
            echo "version=$version"
            echo "build_number=$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify complete patch collection
    needs: prepare
    uses: ./.github/workflows/patched-beta.yml
    with:
      beta_sha: ${{ needs.prepare.outputs.beta_sha }}

  android:
    name: Android signed OSS APKs
    needs: [prepare, verify]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: patchset
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare.outputs.beta_sha }}
          path: source
          submodules: recursive
          persist-credentials: false
      - name: Apply enabled patches
        run: bash patchset/scripts/apply-patches.sh patchset source

      - name: Configure Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        uses: axi92/flutter-action@72633a794ba0b23276fa4fc465a6cacb758a90c5
        with:
          channel: stable
      - name: Prepare native assets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          flutter config --enable-native-assets
      - name: Configure OSS source tree
        working-directory: source
        run: |
          set -euo pipefail
          dart tool/configure_build.dart --profile=oss
          # Match upstream's macOS UnifiedPush dependency workaround.
          bash tool/apply_macos_pub_overrides.sh
          flutter pub get
          dart run build_runner build

      - name: Require stable Android release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Android signing secrets are required. Refusing to publish debug-signed APKs."
            exit 1
          fi
          keyfile="$RUNNER_TEMP/fluxer-patched-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$keyfile"
          } > source/android/key.properties

      - name: Build Android universal and split APKs
        working-directory: source
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--release --flavor betaUnifiedpush
            --build-name "$BUILD_VERSION" --build-number "$BUILD_NUMBER"
            --dart-define-from-file=tool/dart_defines/beta.json
            --dart-define=PUSH_PROVIDER=unifiedpush)
          flutter build apk "${args[@]}" --split-per-abi
          flutter build apk "${args[@]}"
      - name: Collect patched Android binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          shopt -s nullglob
          files=(source/build/app/outputs/flutter-apk/*betaunifiedpush-release.apk)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            stem="$(basename "$file" .apk)"
            stem="${stem#app-}"
            cp "$file" "artifacts/Fluxer-Beta-Android-$stem-patched.apk"
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: patched-android
          path: artifacts/*.apk
          if-no-files-found: error

  ios:
    name: iOS signed IPA (optional)
    if: ${{ endsWith(github.ref_name, '-both') || (github.event_name == 'workflow_dispatch' && inputs.include_ios == true) }}
    needs: [prepare, verify]
    runs-on: macos-26
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: patchset
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare.outputs.beta_sha }}
          path: source
          submodules: recursive
          persist-credentials: false
      - name: Apply enabled patches
        run: bash patchset/scripts/apply-patches.sh patchset source

      - name: Install Flutter
        uses: axi92/flutter-action@72633a794ba0b23276fa4fc465a6cacb758a90c5
        with:
          channel: stable
      - name: Install iOS Rust target
        run: |
          rustup target add aarch64-apple-ios
          flutter config --enable-native-assets
      - name: Configure iOS store build
        working-directory: source
        run: |
          dart tool/configure_build.dart --profile=ios-store
          flutter pub get
          dart run build_runner build

      - name: Require Apple distribution credentials and export options
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATES_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATES_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          BROADCAST_BASE64: ${{ secrets.BROADCAST_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          NOTIFICATION_BASE64: ${{ secrets.NOTIFICATION_SERVICE_PROVISIONING_PROFILE_BASE64 }}
          SHARE_BASE64: ${{ secrets.SHARE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          EXPORT_OPTIONS_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" || -z "$PROFILE_BASE64" ||
                -z "$BROADCAST_BASE64" || -z "$NOTIFICATION_BASE64" || -z "$SHARE_BASE64" ||
                -z "$EXPORT_OPTIONS_BASE64" ]]; then
            echo "::error::Missing Apple distribution certificate, app/extension provisioning profiles, or IOS_EXPORT_OPTIONS_PLIST_BASE64."
            exit 1
          fi
          keychain="$RUNNER_TEMP/patched-build.keychain-db"
          security create-keychain -p patched-ci "$keychain"
          security unlock-keychain -p patched-ci "$keychain"
          security list-keychains -d user -s "$keychain"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/ios-cert.p12"
          security import "$RUNNER_TEMP/ios-cert.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k patched-ci "$keychain"
          rm "$RUNNER_TEMP/ios-cert.p12"
          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$profiles/fluxer-patched.mobileprovision"
          printf '%s' "$BROADCAST_BASE64" | base64 --decode > "$profiles/fluxer-patched-broadcast.mobileprovision"
          printf '%s' "$NOTIFICATION_BASE64" | base64 --decode > "$profiles/fluxer-patched-notification.mobileprovision"
          printf '%s' "$SHARE_BASE64" | base64 --decode > "$profiles/fluxer-patched-share.mobileprovision"
          printf '%s' "$EXPORT_OPTIONS_BASE64" | base64 --decode > "$RUNNER_TEMP/PatchedExportOptions.plist"
          plutil -lint "$RUNNER_TEMP/PatchedExportOptions.plist"
          echo "IOS_EXPORT_OPTIONS=$RUNNER_TEMP/PatchedExportOptions.plist" >> "$GITHUB_ENV"

      - name: Build signed iOS IPA (do not upload to TestFlight)
        working-directory: source
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        shell: bash
        run: |
          flutter build ipa --release --flavor beta \
            --build-name "$BUILD_VERSION" \
            --build-number "$BUILD_NUMBER" \
            --dart-define-from-file=tool/dart_defines/beta.json \
            --export-options-plist "$IOS_EXPORT_OPTIONS"
      - name: Collect signed IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          shopt -s nullglob
          files=(source/build/ios/ipa/*.ipa)
          if [[ "${#files[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one signed IPA."
            exit 1
          fi
          cp "${files[0]}" artifacts/Fluxer-Beta-iOS-patched.ipa
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: patched-ios
          path: artifacts/*.ipa
          if-no-files-found: error

  publish:
    name: Publish signed binaries as a GitHub prerelease
    needs: [prepare, verify, android, ios]
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/patched') || inputs.publish == true) && needs.prepare.result == 'success' && needs.verify.result == 'success' && needs.android.result == 'success' && (needs.ios.result == 'success' || needs.ios.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: patched-android
          path: release-assets
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        if: needs.ios.result == 'success'
        with:
          name: patched-ios
          path: release-assets
      - name: Publish only if all signed assets are available
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BASE_SHA: ${{ needs.prepare.outputs.beta_sha }}
          PATCH_SHA: ${{ needs.prepare.outputs.patch_sha }}
          INCLUDE_IOS: ${{ needs.ios.result == 'success' }}
        run: |
          set -euo pipefail
          if [[ "$INCLUDE_IOS" == "true" ]]; then
            test -f release-assets/Fluxer-Beta-iOS-patched.ipa
          fi
          shopt -s nullglob
          apks=(release-assets/*-patched.apk)
          test "${#apks[@]}" -gt 0
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release with this tag already exists. Use a fresh patched revision."
            exit 1
          fi
          {
            echo "Fluxer Beta $VERSION (patched)"
            echo
            echo "Built from clean upstream-beta commit: $BASE_SHA"
            echo "Independent patchset commit: $PATCH_SHA"
            echo
            echo "Android APKs passed patch verification and signed build jobs."
            if [[ "$INCLUDE_IOS" == "true" ]]; then
              echo "Signed iOS IPA included; installation requires matching Apple signing/provisioning."
            else
              echo "iOS IPA not requested for this Android-only release."
            fi
            echo "App bundle identifiers are inherited from upstream Beta."
          } > release-notes.txt
          (cd release-assets && sha256sum ./* > SHA256SUMS.txt)
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Fluxer Beta $VERSION-patched" \
            --notes-file release-notes.txt \
            --prerelease
